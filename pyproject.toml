[project]
name = "foto-olcum"
version = "0.1.0"
description = "Fotoğraftan parametrik FreeCAD modeli çıkaran MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "opencv-contrib-python-headless>=5.0",
    "numpy>=2",
    "scipy>=1.13",
    "trimesh>=4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
foto-olcum-mcp = "foto_olcum.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foto_olcum = ["freecad_build/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
